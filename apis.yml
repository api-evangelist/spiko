aid: spiko
name: Spiko
description: >-
  Spiko is a European fintech and MiFID-authorized investment firm (ACPR license
  #19183) offering regulated daily treasury management through tokenized,
  UCITS-approved government money market funds and multi-currency cash accounts
  (EUR, USD, GBP, CHF). Businesses and individuals earn the risk-free rate on idle
  cash while keeping daily liquidity; client funds are custodied by CACEIS Bank
  and Spiko itself holds no client funds. Spiko exposes three developer APIs: an
  open Public API for fund, share-class, NAV, yield, and exchange-rate data; an
  Investor API for direct clients and partners to manage accounts and
  deposit/withdrawal/transfer orders; and a Distributor API for partners to
  onboard investors, manage accounts and orders, and receive webhook events.
url: https://raw.githubusercontent.com/api-evangelist/spiko/refs/heads/main/apis.yml
