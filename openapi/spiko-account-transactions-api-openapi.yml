                              - type: 'null'
                            confirmedAt:
                              anyOf:
                              - $ref: '#/components/schemas/Date'
                              - type: 'null'
                            applicableExchangeRateConversion:
                              anyOf:
                              - type: object
                                required:
                                - exchangeRate
                                - convertedAmount
                                properties:
                                  exchangeRate:
                                    type: object
                                    required:
                                    - fundId
                                    - day
                                    - baseCurrency
                                    - quoteCurrency
                                    - fxRate
                                    properties:
                                      fundId:
                                        type: string
                                        description: a Universally Unique Identifier
                                        format: uuid
                                      day:
                                        type: string
                                        title: Day
                                        description: a day in ISO format "YYYY-MM-DD"
                                      baseCurrency:
                                        type: string
