                    - JPY
                    - SGD
                    title: Currency code
                    identifier: CurrencyCode
                    description: a currency code among "EUR", "USD", "GBP", "CHF", "JPY", "SGD"
                  accounts:
                    type: array
                    items:
                      type: object
                      required:
                      - accountDetails
