                    description: a string that will be trimmed
                  lastName:
                    type: string
                    description: a string that will be trimmed
                  country:
                    $ref: '#/components/schemas/CountryCodeAlpha2'
                  address:
                    type: string
                    description: a string that will be trimmed
                  zipCode:
                    type: string
                    description: a string that will be trimmed
                  city:
                    type: string
                    description: a string that will be trimmed
                  details:
