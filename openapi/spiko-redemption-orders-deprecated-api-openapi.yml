openapi: 3.1.0
info:
  title: Spiko Distributor Account transactions Redemption Orders (deprecated) API
  version: v0
  description: The Distributor API allows third parties like SaaS providers, fintechs or Web3 companies to distribute the Spiko Funds to their customers. With this API, you can programmatically manage investors, send subscription and redemption orders, and access real-time portfolio information.
servers:
- url: https://distributor-api.spiko.io
  description: Production Server
- url: https://distributor-api.preprod.spiko.io
  description: Pre-production Server
security: []
tags:
- name: Redemption Orders (deprecated)
paths:
  /redemption-orders/:
    post:
      tags:
      - Redemption Orders (deprecated)
      operationId: redemptionOrders.createRedemptionOrder
      parameters: []
      security:
      - basicAuth: []
      - oauth2: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - investorId
                - accountId
                - shareClassId
                - sharesAmount
                - amount
                - amountInShareClassCurrency
                - destination
                - createdAt
                - executedAt
                - status
                - shareClassAccountId
                - custodialAccountId
                properties:
                  id:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  investorId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  accountId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  shareClassId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  sharesAmount:
                    anyOf:
                    - $ref: '#/components/schemas/BigDecimal'
                    - type: 'null'
                  amount:
                    anyOf:
                    - $ref: '#/components/schemas/Amount'
                    - type: 'null'
                  amountInShareClassCurrency:
                    anyOf:
                    - $ref: '#/components/schemas/Amount'
                    - type: 'null'
                  destination:
                    anyOf:
                    - type: object
                      required:
                      - type
                      - bankAccountId
                      properties:
                        type:
                          type: string
                          enum:
                          - bank-transfer
                        bankAccountId:
                          anyOf:
                          - type: string
                            description: a Universally Unique Identifier
                            format: uuid
                          - type: 'null'
                      additionalProperties: false
                    - type: object
                      required:
                      - type
                      - shareClassId
                      properties:
                        type:
                          type: string
                          enum:
                          - fund-swap
                        shareClassId:
                          type: string
                          description: a Universally Unique Identifier
                          format: uuid
                      additionalProperties: false
                    - type: object
                      required:
                      - type
                      - iban
                      - bic
                      - reference
                      properties:
                        type:
                          type: string
                          enum:
                          - loan-repayment
                        iban:
                          title: IBAN
                          type: string
                          description: a valid IBAN (International Bank Account Number)
                        bic:
                          title: BIC
                          type: string
                          description: A valid BIC (Bank Identifier Code)
                        reference:
                          type: string
                      additionalProperties: false
                    - type: object
                      required:
                      - type
                      properties:
                        type:
                          type: string
                          enum:
                          - collection-returned
                      additionalProperties: false
                    - type: object
                      required:
                      - type
                      - walletId
                      properties:
                        type:
                          type: string
                          enum:
                          - stablecoin-transfer
                        walletId:
                          type: string
                          description: a Universally Unique Identifier
                          format: uuid
                      additionalProperties: false
                  createdAt:
                    $ref: '#/components/schemas/Date'
                  executedAt:
                    anyOf:
                    - $ref: '#/components/schemas/Date'
                    - type: 'null'
                  status:
                    type: string
                    enum:
                    - pending
                    - executed
                    - canceled
                  shareClassAccountId:
                    type: string
                    title: UUID
                    description: please now use pair `{accountId, shareClassId}` instead
                    deprecated: true
                  custodialAccountId:
                    type: string
                    title: UUID
                    description: please now use pair `{accountId, shareClassId}` instead
                    deprecated: true
                additionalProperties: false
        '400':
          description: The request did not match the expected schema
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HttpApiDecodeError'
                - $ref: '#/components/schemas/BadRequest'
                - $ref: '#/components/schemas/InsufficientBalanceError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Unauthorized'
                - $ref: '#/components/schemas/InvestorAuthenticationError'
        '403':
          description: Forbidden
      description: '**Deprecated - use withdrawal endpoints instead.** Create a new redemption order for an investor and return the order info.'
      summary: Create a new redemption order
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - shareClassId
              - amount
              - bankAccountId
              properties:
                accountId:
                  type: string
                  description: a Universally Unique Identifier
                  format: uuid
                shareClassId:
                  type: string
                  description: a Universally Unique Identifier
                  format: uuid
                amount:
                  $ref: '#/components/schemas/NonNegativeAmount'
                bankAccountId:
                  type: string
                  description: a Universally Unique Identifier
                  format: uuid
              additionalProperties: false
        required: true
    get:
      tags:
      - Redemption Orders (deprecated)
      operationId: redemptionOrders.getRedemptionOrders
      parameters:
      - name: investorId
        in: query
        schema:
          type: string
          description: a Universally Unique Identifier
          format: uuid
        required: true
        description: a Universally Unique Identifier
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - executed
          - canceled
        required: false
      security:
      - basicAuth: []
      - oauth2: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - investorId
                  - accountId
                  - shareClassId
                  - sharesAmount
                  - amount
                  - amountInShareClassCurrency
                  - destination
                  - createdAt
                  - executedAt
                  - status
                  - shareClassAccountId
                  - custodialAccountId
                  properties:
                    id:
                      type: string
                      description: a Universally Unique Identifier
                      format: uuid
                    investorId:
                      type: string
                      description: a Universally Unique Identifier
                      format: uuid
                    accountId:
                      type: string
                      description: a Universally Unique Identifier
                      format: uuid
                    shareClassId:
                      type: string
                      description: a Universally Unique Identifier
                      format: uuid
                    sharesAmount:
                      anyOf:
                      - $ref: '#/components/schemas/BigDecimal'
                      - type: 'null'
                    amount:
                      anyOf:
                      - $ref: '#/components/schemas/Amount'
                      - type: 'null'
                    amountInShareClassCurrency:
                      anyOf:
                      - $ref: '#/components/schemas/Amount'
                      - type: 'null'
                    destination:
                      anyOf:
                      - type: object
                        required:
                        - type
                        - bankAccountId
                        properties:
                          type:
                            type: string
                            enum:
                            - bank-transfer
                          bankAccountId:
                            anyOf:
                            - type: string
                              description: a Universally Unique Identifier
                              format: uuid
                            - type: 'null'
                        additionalProperties: false
                      - type: object
                        required:
                        - type
                        - shareClassId
                        properties:
                          type:
                            type: string
                            enum:
                            - fund-swap
                          shareClassId:
                            type: string
                            description: a Universally Unique Identifier
                            format: uuid
                        additionalProperties: false
                      - type: object
                        required:
                        - type
                        - iban
                        - bic
                        - reference
                        properties:
                          type:
                            type: string
                            enum:
                            - loan-repayment
                          iban:
                            title: IBAN
                            type: string
                            description: a valid IBAN (International Bank Account Number)
                          bic:
                            title: BIC
                            type: string
                            description: A valid BIC (Bank Identifier Code)
                          reference:
                            type: string
                        additionalProperties: false
                      - type: object
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            enum:
                            - collection-returned
                        additionalProperties: false
                      - type: object
                        required:
                        - type
                        - walletId
                        properties:
                          type:
                            type: string
                            enum:
                            - stablecoin-transfer
                          walletId:
                            type: string
                            description: a Universally Unique Identifier
                            format: uuid
                        additionalProperties: false
                    createdAt:
                      $ref: '#/components/schemas/Date'
                    executedAt:
                      anyOf:
                      - $ref: '#/components/schemas/Date'
                      - type: 'null'
                    status:
                      type: string
                      enum:
                      - pending
                      - executed
                      - canceled
                    shareClassAccountId:
                      type: string
                      title: UUID
                      description: please now use pair `{accountId, shareClassId}` instead
                      deprecated: true
                    custodialAccountId:
                      type: string
                      title: UUID
                      description: please now use pair `{accountId, shareClassId}` instead
                      deprecated: true
                  additionalProperties: false
        '400':
          description: The request did not match the expected schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpApiDecodeError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Unauthorized'
                - $ref: '#/components/schemas/InvestorAuthenticationError'
        '403':
          description: Forbidden
        '404':
          description: NotFound
      description: '

        **Deprecated - use withdrawal endpoints instead.** Get all redemption orders for a given investor with optional status filter.


        > ⚠️ **For displaying an account''s activity, prefer the [account transaction history endpoint](#tag/Account-Transactions/operation/accountTransactions.getAccountTransactions).** It returns deposits, withdrawals, transfers and yield accruals as a single time-ordered stream, with cursor pagination, so you don''t need to call multiple per-order-type endpoints and reconcile their results.

        '
      summary: Get list of an investor's redemption orders
      deprecated: true
  /redemption-orders/instant:
    post:
      tags:
      - Redemption Orders (deprecated)
      operationId: redemptionOrders.createInstantRedemptionOrder
      parameters: []
      security:
      - basicAuth: []
      - oauth2: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - investorId
                - accountId
                - shareClassId
                - amount
                - createdAt
                - destination
                - status
                properties:
                  id:
                    type: string
                  investorId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  accountId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  shareClassId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  amount:
                    $ref: '#/components/schemas/NonNegativeAmount'
                  createdAt:
                    $ref: '#/components/schemas/Date'
                  destination:
                    type: object
                    required:
                    - type
                    - bankAccountId
                    properties:
                      type:
                        type: string
                        enum:
                        - bank-transfer
                      bankAccountId:
                        type: string
                        description: a Universally Unique Identifier
                        format: uuid
                    additionalProperties: false
                  status:
                    type: string
                    enum:
                    - created
                    - executed
                additionalProperties: false
        '400':
          description: The request did not match the expected schema
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HttpApiDecodeError'
                - $ref: '#/components/schemas/BadRequest'
                - $ref: '#/components/schemas/InsufficientBalanceError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Unauthorized'
                - $ref: '#/components/schemas/InvestorAuthenticationError'
        '403':
          description: Forbidden
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
      description: '**Deprecated - use withdrawal endpoints instead.** Create an instant redemption order for an investor. Only available for organization investors who have accepted terms of use.'
      summary: Create a new instant redemption order
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - accountId
              - shareClassId
              - amount
              - bankAccountId
              properties:
                accountId:
                  type: string
                  description: a Universally Unique Identifier
                  format: uuid
                shareClassId:
                  type: string
                  description: a Universally Unique Identifier
                  format: uuid
                amount:
                  $ref: '#/components/schemas/NonNegativeAmount'
                bankAccountId:
                  type: string
                  description: a Universally Unique Identifier
                  format: uuid
              additionalProperties: false
        required: true
  /redemption-orders/{redemptionOrderId}:
    get:
      tags:
      - Redemption Orders (deprecated)
      operationId: redemptionOrders.getRedemptionOrder
      parameters:
      - name: redemptionOrderId
        in: path
        schema:
          type: string
          description: a Universally Unique Identifier
          format: uuid
        required: true
        description: a Universally Unique Identifier
      security:
      - basicAuth: []
      - oauth2: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - investorId
                - accountId
                - shareClassId
                - sharesAmount
                - amount
                - amountInShareClassCurrency
                - destination
                - createdAt
                - executedAt
                - status
                - shareClassAccountId
                - custodialAccountId
                properties:
                  id:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  investorId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  accountId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  shareClassId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  sharesAmount:
                    anyOf:
                    - $ref: '#/components/schemas/BigDecimal'
                    - type: 'null'
                  amount:
                    anyOf:
                    - $ref: '#/components/schemas/Amount'
                    - type: 'null'
                  amountInShareClassCurrency:
                    anyOf:
                    - $ref: '#/components/schemas/Amount'
                    - type: 'null'
                  destination:
                    anyOf:
                    - type: object
                      required:
                      - type
                      - bankAccountId
                      properties:
                        type:
                          type: string
                          enum:
                          - bank-transfer
                        bankAccountId:
                          anyOf:
                          - type: string
                            description: a Universally Unique Identifier
                            format: uuid
                          - type: 'null'
                      additionalProperties: false
                    - type: object
                      required:
                      - type
                      - shareClassId
                      properties:
                        type:
                          type: string
                          enum:
                          - fund-swap
                        shareClassId:
                          type: string
                          description: a Universally Unique Identifier
                          format: uuid
                      additionalProperties: false
                    - type: object
                      required:
                      - type
                      - iban
                      - bic
                      - reference
                      properties:
                        type:
                          type: string
                          enum:
                          - loan-repayment
                        iban:
                          title: IBAN
                          type: string
                          description: a valid IBAN (International Bank Account Number)
                        bic:
                          title: BIC
                          type: string
                          description: A valid BIC (Bank Identifier Code)
                        reference:
                          type: string
                      additionalProperties: false
                    - type: object
                      required:
                      - type
                      properties:
                        type:
                          type: string
                          enum:
                          - collection-returned
                      additionalProperties: false
                    - type: object
