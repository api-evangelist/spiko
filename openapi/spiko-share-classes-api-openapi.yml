  /share-classes/{shareClassSymbol}/yield:
    get:
      tags:
      - Share Classes
      operationId: Get Share Class Yield
      parameters:
      - name: shareClassSymbol
        in: path
        schema:
          $ref: '#/components/schemas/ShareClassSymbol'
        required: true
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - shareClassId
                - dailyYield
                - weeklyYield
                - monthlyYield
                - updatedAt
                - nextYieldTimestamp
                - previousYieldTimestamp
                properties:
                  shareClassId:
                    type: string
                    description: a Universally Unique Identifier
                    format: uuid
                  dailyYield:
                    $ref: '#/components/schemas/BigDecimal'
                  weeklyYield:
                    anyOf:
                    - $ref: '#/components/schemas/BigDecimal'
                    - type: 'null'
                  monthlyYield:
                    anyOf:
                    - $ref: '#/components/schemas/BigDecimal'
                    - type: 'null'
                  updatedAt:
                    $ref: '#/components/schemas/Date'
                  nextYieldTimestamp:
                    type: string
                    title: Timestamp
                    description: A timestamp in seconds since the Unix epoch (1970-01-01T00:00:00Z), e.g. "1753347047"
                  previousYieldTimestamp:
                    anyOf:
                    - type: object
                      required:
                      - _tag
                      properties:
                        _tag:
                          type: string
                          enum:
                          - None
                      additionalProperties: false
                      description: NoneEncoded
                    - type: object
                      required:
                      - _tag
                      - value
                      properties:
                        _tag:
                          type: string
                          enum:
                          - Some
                        value:
                          type: string
                          title: Timestamp
                          description: A timestamp in seconds since the Unix epoch (1970-01-01T00:00:00Z), e.g. "1753347047"
                      additionalProperties: false
                      description: SomeEncoded<nonNegativeBigInt & Brand<"Timestamp">>
                    description: OptionEncoded<nonNegativeBigInt & Brand<"Timestamp">>
                additionalProperties: false
        '400':
          description: The request did not match the expected schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpApiDecodeError'
        '404':
          description: NotFound
