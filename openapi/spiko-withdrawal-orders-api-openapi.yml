                        properties:
                          type:
                            type: string
                            enum:
                            - stablecoin-transfer
                          walletId:
                            type: string
                            description: a Universally Unique Identifier
                            format: uuid
                        additionalProperties: false
                    quantity:
                      anyOf:
                      - type: object
                        required:
                        - mode
                        - amount
                        properties:
                          mode:
                            type: string
                            enum:
                            - amount
                          amount:
                            $ref: '#/components/schemas/NonNegativeAmount'
                        additionalProperties: false
                      - type: object
                        required:
                        - mode
