            - available
            properties:
              type:
                type: string
                enum:
                - shares
              requested:
                $ref: '#/components/schemas/BigDecimal'
              available:
                $ref: '#/components/schemas/BigDecimal'
            additionalProperties: false
          - type: object
            required:
            - type
            - requested
            - available
